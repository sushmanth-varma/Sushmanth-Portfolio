<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#181e2e" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#5a189a" />
    </linearGradient>
    <filter id="calcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7928ca" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#calcBg)" />

  <!-- Background Doodles / Glow Blobs -->
  <circle cx="160" cy="120" r="100" fill="#7928ca" opacity="0.18" filter="blur(40px)" />
  <circle cx="640" cy="320" r="120" fill="#0070f3" opacity="0.18" filter="blur(40px)" />

  <!-- Mathematical formulas decorative background -->
  <text x="60" y="80" font-family="monospace" font-size="14" fill="#334155" opacity="0.4">f(x) = ∫ 2x dx + C · π ≈ 3.14159</text>
  <text x="560" y="90" font-family="monospace" font-size="14" fill="#334155" opacity="0.4">∑ (n=1 to ∞) 1/n² = π²/6</text>
  <text x="80" y="390" font-family="monospace" font-size="14" fill="#334155" opacity="0.4">√256 = 16 · log₂(1024) = 10</text>
  <text x="540" y="400" font-family="monospace" font-size="14" fill="#334155" opacity="0.4">E = mc² · Δx·Δp ≥ ℏ/2</text>

  <!-- Central Calculator Frame -->
  <g transform="translate(260, 25)" filter="url(#calcGlow)">
    <rect width="280" height="400" rx="28" fill="#141824" stroke="#2d3748" stroke-width="2" />

    <!-- Window top dots -->
    <circle cx="28" cy="22" r="5" fill="#ff5f56" />
    <circle cx="44" cy="22" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="22" r="5" fill="#27c93f" />
    <text x="140" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748b">CALCULATOR v2.0</text>

    <!-- Display Screen -->
    <g transform="translate(20, 42)">
      <rect width="240" height="74" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
      <text x="224" y="30" text-anchor="end" font-family="monospace" font-size="13" fill="#64748b">1,248 × 3.5 + 40</text>
      <text x="224" y="60" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Inter', monospace" font-size="28" font-weight="700" fill="#00df89">4,408.00</text>
    </g>

    <!-- Keypad Grid (4 cols x 5 rows) -->
    <g transform="translate(20, 130)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="52" height="44" rx="12" fill="#242b3d" />
      <text x="26" y="27" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff5555">AC</text>

      <rect x="62" y="0" width="52" height="44" rx="12" fill="#242b3d" />
      <text x="88" y="27" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">⌫</text>

      <rect x="124" y="0" width="52" height="44" rx="12" fill="#242b3d" />
      <text x="150" y="27" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">%</text>

      <rect x="188" y="0" width="52" height="44" rx="12" fill="url(#neonPurple)" />
      <text x="214" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">÷</text>

      <!-- Row 2 -->
      <rect x="0" y="52" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="26" y="79" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">7</text>

      <rect x="62" y="52" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="88" y="79" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">8</text>

      <rect x="124" y="52" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="150" y="79" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">9</text>

      <rect x="188" y="52" width="52" height="44" rx="12" fill="url(#neonPurple)" />
      <text x="214" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">×</text>

      <!-- Row 3 -->
      <rect x="0" y="104" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="26" y="131" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">4</text>

      <rect x="62" y="104" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="88" y="131" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">5</text>

      <rect x="124" y="104" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="150" y="131" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">6</text>

      <rect x="188" y="104" width="52" height="44" rx="12" fill="url(#neonPurple)" />
      <text x="214" y="132" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">−</text>

      <!-- Row 4 -->
      <rect x="0" y="156" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="26" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">1</text>

      <rect x="62" y="156" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="88" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">2</text>

      <rect x="124" y="156" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="150" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">3</text>

      <rect x="188" y="156" width="52" height="44" rx="12" fill="url(#neonPurple)" />
      <text x="214" y="184" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">+</text>

      <!-- Row 5 -->
      <rect x="0" y="208" width="114" height="44" rx="12" fill="#1b2234" />
      <text x="57" y="235" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">0</text>

      <rect x="124" y="208" width="52" height="44" rx="12" fill="#1b2234" />
      <text x="150" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f1f5f9">.</text>

      <rect x="188" y="208" width="52" height="44" rx="12" fill="url(#neonOrange)" />
      <text x="214" y="236" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">=</text>
    </g>
  </g>
</svg>
