<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f6" />
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26c0ff" />
      <stop offset="20%" stop-color="#e600c2" />
      <stop offset="40%" stop-color="#ff4940" />
      <stop offset="60%" stop-color="#ffa130" />
      <stop offset="80%" stop-color="#ffc837" />
      <stop offset="100%" stop-color="#00cc3d" />
    </linearGradient>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08304c" />
      <stop offset="100%" stop-color="#0a4b73" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#08304c" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Browser Window Frame -->
  <g transform="translate(40, 24)" filter="url(#cardShadow)">
    <rect width="720" height="402" rx="16" fill="#ffffff" stroke="#dedede" stroke-width="1" />
    
    <!-- Browser Top Bar -->
    <rect width="720" height="42" rx="16" fill="#fcfcfc" />
    <rect y="41" width="720" height="1" fill="#dedede" />
    <circle cx="28" cy="21" r="5" fill="#ff5f56" />
    <circle cx="44" cy="21" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="21" r="5" fill="#27c93f" />

    <!-- Address Bar -->
    <rect x="90" y="10" width="460" height="22" rx="11" fill="#f1f3f5" />
    <text x="110" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#797979">https://incredibleindia.travel/explore</text>
    
    <!-- Lighthouse Badge -->
    <rect x="580" y="10" width="120" height="22" rx="11" fill="#d7ffe2" />
    <circle cx="595" cy="21" r="4" fill="#00cc3d" />
    <text x="606" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="10" fill="#08304c">LIGHTHOUSE 98</text>

    <!-- Main Content Grid -->
    <g transform="translate(24, 60)">
      <!-- Left: Accordion States List -->
      <g>
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="15" fill="#08304c">States &amp; Destinations</text>
        
        <!-- Accordion Item 1 (Active: Kerala) -->
        <g transform="translate(0, 32)">
          <rect width="250" height="74" rx="12" fill="#e8f1ff" stroke="#26c0ff" stroke-width="1.5" />
          <circle cx="24" cy="26" r="10" fill="#08304c" />
          <text x="21" y="30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">1</text>
          <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" fill="#08304c">Kerala · God's Own Country</text>
          <text x="44" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#797979">Alleppey · Munnar · Kochi · Wayanad</text>
          <rect x="44" y="50" width="70" height="15" rx="7.5" fill="#d7ffe2" />
          <text x="52" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#08304c">5 DESTINATIONS</text>
        </g>

        <!-- Accordion Item 2 (Goa) -->
        <g transform="translate(0, 116)">
          <rect width="250" height="48" rx="12" fill="#ffffff" stroke="#dedede" stroke-width="1" />
          <circle cx="24" cy="24" r="10" fill="#f1f3f5" />
          <text x="21" y="28" font-family="sans-serif" font-size="10" font-weight="bold" fill="#797979">2</text>
          <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" fill="#08304c">Goa · Pearl of the Orient</text>
          <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#797979">Calangute · Dudhsagar · Panaji</text>
        </g>

        <!-- Accordion Item 3 (Maharashtra) -->
        <g transform="translate(0, 172)">
          <rect width="250" height="48" rx="12" fill="#ffffff" stroke="#dedede" stroke-width="1" />
          <circle cx="24" cy="24" r="10" fill="#f1f3f5" />
          <text x="21" y="28" font-family="sans-serif" font-size="10" font-weight="bold" fill="#797979">3</text>
          <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" fill="#08304c">Maharashtra · Gateway</text>
          <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#797979">Gateway of India · Ajanta Caves</text>
        </g>

        <!-- Accordion Item 4 (Tamil Nadu) -->
        <g transform="translate(0, 228)">
          <rect width="250" height="48" rx="12" fill="#ffffff" stroke="#dedede" stroke-width="1" />
          <circle cx="24" cy="24" r="10" fill="#f1f3f5" />
          <text x="21" y="28" font-family="sans-serif" font-size="10" font-weight="bold" fill="#797979">4</text>
          <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" fill="#08304c">Tamil Nadu · Land of Temples</text>
          <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#797979">Madurai · Mahabalipuram · Ooty</text>
        </g>
      </g>

      <!-- Right: Interactive Destination Showcase -->
      <g transform="translate(270, 0)">
        <!-- Featured Card: Alleppey Backwaters -->
        <g>
          <rect width="400" height="276" rx="16" fill="url(#heroSky)" />
          
          <!-- Decorative Water Waves & Palms -->
          <path d="M 0,200 Q 100,185 200,200 T 400,200 L 400,276 L 0,276 Z" fill="#062237" opacity="0.6"/>
          <path d="M 0,225 Q 100,210 200,225 T 400,225 L 400,276 L 0,276 Z" fill="#041827" />

          <!-- Sun Accent -->
          <circle cx="340" cy="70" r="32" fill="#ffebd6" opacity="0.25" />
          <circle cx="340" cy="70" r="20" fill="#ffa130" opacity="0.6" />

          <!-- Destination Info Overlay -->
          <rect x="20" y="20" width="130" height="24" rx="12" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.2)" />
          <text x="32" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">📍 ALAPPUZHA, KERALA</text>

          <text x="24" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Alleppey Backwaters</text>
          <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#e8f1ff" opacity="0.9">Venice of the East · Traditional Kettuvallam houseboats</text>

          <!-- Interactive Coordinates Pill -->
          <rect x="24" y="152" width="180" height="26" rx="13" fill="#ffffff" />
          <circle cx="38" cy="165" r="5" fill="#ff4940" />
          <text x="50" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#08304c">9.4981° N, 76.3388° E</text>

          <!-- Directions Pill Button -->
          <rect x="214" y="152" width="120" height="26" rx="13" fill="url(#rainbow)" />
          <text x="236" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">View on Maps ↗</text>

          <!-- Stats Strip -->
          <g transform="translate(24, 210)">
            <rect width="352" height="46" rx="10" fill="rgba(8, 48, 76, 0.75)" stroke="rgba(255,255,255,0.12)" />
            <text x="20" y="22" font-family="sans-serif" font-size="9" fill="#797979">ENTRY</text>
            <text x="20" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d7ffe2">Houseboats ₹8,000</text>
            
            <text x="140" y="22" font-family="sans-serif" font-size="9" fill="#797979">TIMING</text>
            <text x="140" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Sunrise – Sunset</text>

            <text x="260" y="22" font-family="sans-serif" font-size="9" fill="#797979">WEATHER</text>
            <text x="260" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffebd6">27°C Tropical</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
