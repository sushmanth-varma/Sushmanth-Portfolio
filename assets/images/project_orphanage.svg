<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08304c" />
      <stop offset="100%" stop-color="#041a2a" />
    </linearGradient>
    <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26c0ff" />
      <stop offset="25%" stop-color="#e600c2" />
      <stop offset="50%" stop-color="#ff4940" />
      <stop offset="75%" stop-color="#ffa130" />
      <stop offset="100%" stop-color="#00cc3d" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#08304c" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="#f6f9fc" />

  <!-- Background Decorative Grid Accent -->
  <path d="M 0,225 L 800,225 M 400,0 L 400,450" stroke="#08304c" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Left: Android Phone 1 (App Feed & GPS Map) -->
  <g transform="translate(80, 20)" filter="url(#phoneShadow)">
    <!-- Phone Outer Body -->
    <rect width="210" height="410" rx="36" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
    <!-- Screen Bezel -->
    <rect x="6" y="6" width="198" height="398" rx="30" fill="#ffffff" />
    
    <!-- Camera Notch / Dynamic Island -->
    <rect x="75" y="12" width="60" height="12" rx="6" fill="#0f172a" />

    <!-- App Header -->
    <rect x="6" y="6" width="198" height="52" rx="30" fill="#08304c" />
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="13" fill="#ffffff">HOPE Orphanage</text>
    <circle cx="180" cy="38" r="8" fill="#d7ffe2" />
    <text x="177" y="42" font-family="sans-serif" font-size="9" fill="#08304c" font-weight="bold">📍</text>

    <!-- Mini GPS Map View -->
    <g transform="translate(16, 68)">
      <rect width="178" height="105" rx="14" fill="#e8f1ff" stroke="#dedede" stroke-width="1" />
      <!-- Roads -->
      <path d="M0,45 Q 60,30 110,65 T 178,50" stroke="#ffffff" stroke-width="6" fill="none" />
      <path d="M70,0 L 70,105 M 130,0 L 130,105" stroke="#ffffff" stroke-width="4" fill="none" />
      <!-- GPS Pulse Marker -->
      <circle cx="100" cy="55" r="16" fill="#26c0ff" opacity="0.25" />
      <circle cx="100" cy="55" r="8" fill="#ff4940" />
      <circle cx="100" cy="55" r="3" fill="#ffffff" />
      <!-- Location Callout -->
      <rect x="52" y="22" width="96" height="18" rx="9" fill="#08304c" />
      <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8" font-weight="600" fill="#ffffff">GPS: 13.0827, 80.2707</text>
    </g>

    <!-- Welfare Report Cards Feed -->
    <g transform="translate(16, 185)">
      <!-- Card 1 -->
      <g>
        <rect width="178" height="66" rx="12" fill="#f8fafc" stroke="#eeeeee" stroke-width="1" />
        <rect x="10" y="10" width="30" height="30" rx="8" fill="#ffebd6" />
        <text x="19" y="30" font-family="sans-serif" font-size="14">🤝</text>
        <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#08304c">Welfare Support #204</text>
        <text x="48" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" fill="#797979">Chennai Central District</text>
        <rect x="48" y="42" width="70" height="15" rx="7.5" fill="#d7ffe2" />
        <text x="56" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8" font-weight="600" fill="#08304c">Active Rescue</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(0, 74)">
        <rect width="178" height="66" rx="12" fill="#f8fafc" stroke="#eeeeee" stroke-width="1" />
        <rect x="10" y="10" width="30" height="30" rx="8" fill="#e8f1ff" />
        <text x="19" y="30" font-family="sans-serif" font-size="14">🎒</text>
        <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#08304c">Education Kit Dispatch</text>
        <text x="48" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" fill="#797979">45 Kids Enrolled</text>
        <rect x="48" y="42" width="62" height="15" rx="7.5" fill="#ffebd6" />
        <text x="56" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8" font-weight="600" fill="#08304c">Distributed</text>
      </g>

      <!-- Bottom Nav Bar -->
      <g transform="translate(0, 154)">
        <rect width="178" height="36" rx="18" fill="#08304c" />
        <text x="24" y="22" font-family="sans-serif" font-size="12" fill="#ffffff">🏠</text>
        <text x="68" y="22" font-family="sans-serif" font-size="12" fill="#26c0ff">📍</text>
        <text x="112" y="22" font-family="sans-serif" font-size="12" fill="#ffffff">📊</text>
        <text x="146" y="22" font-family="sans-serif" font-size="12" fill="#ffffff">⚙️</text>
      </g>
    </g>
  </g>

  <!-- Right: Architecture & REST API Backend Breakdown Card -->
  <g transform="translate(320, 36)" filter="url(#phoneShadow)">
    <rect width="420" height="378" rx="24" fill="#ffffff" stroke="#353535" stroke-opacity="0.08" stroke-width="1" />
    
    <g transform="translate(28, 28)">
      <rect width="130" height="24" rx="12" fill="#e8f1ff" />
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="10" fill="#08304c" letter-spacing="0.5">ANDROID + PHP REST</text>

      <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="20" fill="#08304c">Full-Stack Mobile Architecture</text>
      <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#797979">Java Native Android front-end linked with 6 PHP endpoints to MySQL</text>

      <!-- Metrics Row -->
      <g transform="translate(0, 90)">
        <rect width="112" height="60" rx="14" fill="#f8fafc" stroke="#dedede" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="800" fill="#08304c">99%</text>
        <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="600" fill="#797979">RETRIEVAL ACCURACY</text>

        <rect x="124" y="0" width="112" height="60" rx="14" fill="#f8fafc" stroke="#dedede" stroke-width="1" />
        <text x="138" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="800" fill="#08304c">1,000+</text>
        <text x="138" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="600" fill="#797979">RECORDS PROCESSED</text>

        <rect x="248" y="0" width="116" height="60" rx="14" fill="#f8fafc" stroke="#dedede" stroke-width="1" />
        <text x="262" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="800" fill="#00cc3d">25% ↓</text>
        <text x="262" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="600" fill="#797979">BUILD TIME REDUCED</text>
      </g>

      <!-- 6 REST APIs List -->
      <g transform="translate(0, 168)">
        <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#08304c">6 CORE REST ENDPOINTS (PHP + MySQL)</text>

        <g transform="translate(0, 26)">
          <rect width="364" height="28" rx="8" fill="#f1f5f9" />
          <text x="12" y="18" font-family="monospace" font-size="10.5" font-weight="bold" fill="#00cc3d">POST</text>
          <text x="50" y="18" font-family="monospace" font-size="10.5" fill="#08304c">/api/welfare/report_incident.php (GPS Tag)</text>
        </g>

        <g transform="translate(0, 60)">
          <rect width="364" height="28" rx="8" fill="#f1f5f9" />
          <text x="12" y="18" font-family="monospace" font-size="10.5" font-weight="bold" fill="#26c0ff">GET</text>
          <text x="50" y="18" font-family="monospace" font-size="10.5" fill="#08304c">/api/shelters/nearby.php?lat=...&amp;lng=...</text>
        </g>

        <g transform="translate(0, 94)">
          <rect width="364" height="28" rx="8" fill="#f1f5f9" />
          <text x="12" y="18" font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffa130">PUT</text>
          <text x="50" y="18" font-family="monospace" font-size="10.5" fill="#08304c">/api/verification/update_status.php</text>
        </g>
      </g>
    </g>
  </g>
</svg>
