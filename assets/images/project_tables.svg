<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tablesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#tablesBg)" />

  <g transform="translate(40, 24)">
    <rect width="720" height="402" rx="20" fill="#131b2e" stroke="#222f4c" stroke-width="1.5" />

    <!-- Window top -->
    <rect width="720" height="44" rx="20" fill="#18233c" />
    <circle cx="28" cy="22" r="5" fill="#ff5f56" />
    <circle cx="44" cy="22" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="22" r="5" fill="#27c93f" />
    <text x="360" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Tables · Data Notebook &amp; Layout Architect</text>

    <!-- Jump Cards Strip -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="155" height="48" rx="10" fill="#1e2c4a" stroke="#26c0ff" stroke-width="1" />
      <text x="14" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#26c0ff">01 BASIC</text>
      <text x="14" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8">Name · Lang · Year</text>

      <rect x="172" y="0" width="155" height="48" rx="10" fill="#18233c" />
      <text x="186" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#e600c2">02 COLSPAN</text>
      <text x="186" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8">Merged Headers</text>

      <rect x="344" y="0" width="155" height="48" rx="10" fill="#18233c" />
      <text x="358" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#ffa130">03 ROWSPAN</text>
      <text x="358" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8">Merged Verticals</text>

      <rect x="516" y="0" width="155" height="48" rx="10" fill="#18233c" />
      <text x="530" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#00df89">04 TIMETABLE</text>
      <text x="530" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8">Full Schedule Grid</text>
    </g>

    <!-- Data Table View -->
    <g transform="translate(24, 126)">
      <!-- Table Header -->
      <rect width="672" height="34" rx="8" fill="#1e2c4a" />
      <text x="24" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">ID</text>
      <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">MODULE / PATTERN</text>
      <text x="280" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">ATTRIBUTES</text>
      <text x="440" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">BROWSER SUPPORT</text>
      <text x="590" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">STATUS</text>

      <!-- Row 1 -->
      <g transform="translate(0, 42)">
        <rect width="672" height="38" rx="6" fill="#162035" />
        <text x="24" y="24" font-family="monospace" font-size="11" fill="#26c0ff">#01</text>
        <text x="80" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff">Compound Colspan &amp; Rowspan</text>
        <text x="280" y="24" font-family="monospace" font-size="10.5" fill="#94a3b8">&lt;td colspan="2" rowspan="3"&gt;</text>
        <text x="440" y="24" font-family="sans-serif" font-size="11" fill="#00df89">100% W3C Valid</text>
        <rect x="586" y="10" width="70" height="20" rx="10" fill="#d7ffe2" />
        <text x="621" y="24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#08304c">PASSED</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 88)">
        <rect width="672" height="38" rx="6" fill="#131b2e" />
        <text x="24" y="24" font-family="monospace" font-size="11" fill="#e600c2">#02</text>
        <text x="80" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff">Weekly University Timetable</text>
        <text x="280" y="24" font-family="monospace" font-size="10.5" fill="#94a3b8">&lt;th scope="col"&gt; Day &amp; Slot</text>
        <text x="440" y="24" font-family="sans-serif" font-size="11" fill="#00df89">Responsive Overflow</text>
        <rect x="586" y="10" width="70" height="20" rx="10" fill="#d7ffe2" />
        <text x="621" y="24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#08304c">PASSED</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 134)">
        <rect width="672" height="38" rx="6" fill="#162035" />
        <text x="24" y="24" font-family="monospace" font-size="11" fill="#ffa130">#03</text>
        <text x="80" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff">Nested Financial Ledger</text>
        <text x="280" y="24" font-family="monospace" font-size="10.5" fill="#94a3b8">&lt;tfoot&gt; &amp; &lt;caption&gt; AA</text>
        <text x="440" y="24" font-family="sans-serif" font-size="11" fill="#00df89">Screen Reader A11y</text>
        <rect x="586" y="10" width="70" height="20" rx="10" fill="#e8f1ff" />
        <text x="621" y="24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#08304c">VERIFIED</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 180)">
        <rect width="672" height="38" rx="6" fill="#131b2e" />
        <text x="24" y="24" font-family="monospace" font-size="11" fill="#00df89">#04</text>
        <text x="80" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff">Dense Sensor Telemetry Grid</text>
        <text x="280" y="24" font-family="monospace" font-size="10.5" fill="#94a3b8">Zebra striping &amp; sticky th</text>
        <text x="440" y="24" font-family="sans-serif" font-size="11" fill="#00df89">CSS Pure Layout</text>
        <rect x="586" y="10" width="70" height="20" rx="10" fill="#d7ffe2" />
        <text x="621" y="24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#08304c">PASSED</text>
      </g>
    </g>
  </g>
</svg>
