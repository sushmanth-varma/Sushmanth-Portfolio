<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="formBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f2" />
      <stop offset="100%" stop-color="#fdfbf9" />
    </linearGradient>
    <linearGradient id="rainbowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26c0ff" />
      <stop offset="25%" stop-color="#e600c2" />
      <stop offset="50%" stop-color="#ff4940" />
      <stop offset="75%" stop-color="#ffa130" />
      <stop offset="100%" stop-color="#00cc3d" />
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#08304c" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#formBg)" />

  <!-- Typeform Main Card -->
  <g transform="translate(60, 30)" filter="url(#softShadow)">
    <rect width="680" height="390" rx="24" fill="#ffffff" stroke="#353535" stroke-opacity="0.08" stroke-width="1" />

    <!-- Top Progress Bar Strip -->
    <rect x="0" y="0" width="680" height="6" rx="3" fill="#eeeeee" />
    <rect x="0" y="0" width="440" height="6" rx="3" fill="url(#rainbowLine)" />

    <!-- Header bar -->
    <g transform="translate(36, 32)">
      <!-- Eyebrow Pill -->
      <rect width="130" height="24" rx="12" fill="#ffebd6" />
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="10" fill="#08304c" letter-spacing="0.5">TYPEFORM UI · STEP 02</text>

      <!-- WCAG Badge -->
      <g transform="translate(490, 0)">
        <rect width="118" height="24" rx="12" fill="#d7ffe2" />
        <text x="14" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="10" fill="#08304c">✓ WCAG AA COMPLIANT</text>
      </g>
    </g>

    <!-- Question Content -->
    <g transform="translate(36, 80)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="24" fill="#08304c">Which engineering track accelerates your vision?</text>
      <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" fill="#797979">Select your primary domain of expertise. Multi-select enabled with instant validation hints.</text>

      <!-- Option Cards Grid -->
      <g transform="translate(0, 68)">
        <!-- Option 1: Selected -->
        <g transform="translate(0, 0)">
          <rect width="290" height="64" rx="16" fill="#e8f1ff" stroke="#26c0ff" stroke-width="1.5" />
          <rect x="16" y="18" width="28" height="28" rx="8" fill="#08304c" />
          <text x="24" y="36" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">A</text>
          <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" fill="#08304c">Full-Stack Web Engineering</text>
          <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#084e72">React · Node · REST APIs · SQL</text>
          <circle cx="266" cy="32" r="9" fill="#00cc3d" />
          <path d="M263,32 L265,34 L269,29" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </g>

        <!-- Option 2: Unselected -->
        <g transform="translate(318, 0)">
          <rect width="290" height="64" rx="16" fill="#ffffff" stroke="#dedede" stroke-width="1" />
          <rect x="16" y="18" width="28" height="28" rx="8" fill="#f1f3f5" />
          <text x="24" y="36" font-family="sans-serif" font-size="12" font-weight="bold" fill="#797979">B</text>
          <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" fill="#08304c">Artificial Intelligence &amp; ML</text>
          <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#797979">Python · Scikit-learn · Pandas</text>
        </g>

        <!-- Option 3: Selected -->
        <g transform="translate(0, 80)">
          <rect width="290" height="64" rx="16" fill="#e8f1ff" stroke="#26c0ff" stroke-width="1.5" />
          <rect x="16" y="18" width="28" height="28" rx="8" fill="#08304c" />
          <text x="24" y="36" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">C</text>
          <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" fill="#08304c">Mobile App Development</text>
          <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#084e72">Java Android · XML · PHP Backend</text>
          <circle cx="266" cy="32" r="9" fill="#00cc3d" />
          <path d="M263,32 L265,34 L269,29" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </g>

        <!-- Option 4: Unselected -->
        <g transform="translate(318, 80)">
          <rect width="290" height="64" rx="16" fill="#ffffff" stroke="#dedede" stroke-width="1" />
          <rect x="16" y="18" width="28" height="28" rx="8" fill="#f1f3f5" />
          <text x="24" y="36" font-family="sans-serif" font-size="12" font-weight="bold" fill="#797979">D</text>
          <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="13" fill="#08304c">IoT &amp; Embedded Systems</text>
          <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#797979">Arduino · C++ · Sensor Automation</text>
        </g>
      </g>

      <!-- Bottom action strip -->
      <g transform="translate(0, 235)">
        <rect width="130" height="38" rx="19" fill="#08304c" />
        <text x="28" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff">OK · Continue ↵</text>

        <text x="148" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#797979">press Enter ↵</text>

        <!-- Form Abandonment Stat Pill -->
        <g transform="translate(420, 4)">
          <rect width="188" height="30" rx="15" fill="#f8fafc" stroke="#dedede" stroke-width="1" />
          <circle cx="16" cy="15" r="4" fill="#ffa130" />
          <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#08304c">-30% Abandonment Risk</text>
        </g>
      </g>
    </g>
  </g>
</svg>
