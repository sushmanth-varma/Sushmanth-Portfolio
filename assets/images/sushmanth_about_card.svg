<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76ff03" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <filter id="aboutGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Lime Green Graffiti Background -->
  <rect width="400" height="320" rx="24" fill="url(#limeGlow)" />

  <!-- Black Spray Paint Splatters & Halftone Dots -->
  <g fill="#090d16">
    <!-- Grunge splatter top-left -->
    <path d="M 0,0 L 160,0 Q 140,50 100,70 Q 60,110 0,90 Z" />
    <circle cx="175" cy="40" r="5" />
    <circle cx="190" cy="20" r="3" />
    <circle cx="125" cy="85" r="4" />
    <circle cx="80" cy="125" r="6" />

    <!-- Grunge splatter bottom-left -->
    <path d="M 0,220 Q 80,240 60,320 L 0,320 Z" />
    <circle cx="90" cy="250" r="7" />
    <circle cx="110" cy="290" r="4" />

    <!-- Halftone dots row -->
    <circle cx="20" cy="150" r="2.5" />
    <circle cx="35" cy="150" r="2.5" />
    <circle cx="50" cy="150" r="2.5" />
    <circle cx="20" cy="165" r="2.5" />
    <circle cx="35" cy="165" r="2.5" />
    <circle cx="50" cy="165" r="2.5" />
  </g>

  <!-- Typography: "FOCUS DISCIPLINE CONSISTENCY" on Left -->
  <g transform="translate(24, 85)" fill="#090d16">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Inter', sans-serif" font-size="28" font-weight="900" letter-spacing="-1">FOCUS</text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Inter', sans-serif" font-size="26" font-weight="900" letter-spacing="-0.8">DISCIPLINE</text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Inter', sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">CONSISTENCY</text>

    <!-- Hand-drawn underline squiggle -->
    <path d="M 0,110 Q 40,118 80,108 T 150,112" fill="none" stroke="#090d16" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Right: Manga / Comic Ink Sketch of Sushmanth -->
  <g transform="translate(190, 40)">
    <!-- Doodle Crown -->
    <path d="M 125,20 L 140,40 L 160,18 L 180,40 L 195,20 L 188,52 L 132,52 Z" fill="none" stroke="#090d16" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Head & Shoulders Ink Illustration -->
    <!-- Shoulders / Jacket -->
    <path d="M 5,260 Q 60,210 110,215 L 155,205 Q 200,210 210,260 Z" fill="#090d16" stroke="#090d16" stroke-width="3" />
    <!-- White inner collar lines -->
    <line x1="110" y1="215" x2="115" y2="260" stroke="#76ff03" stroke-width="3" />
    <line x1="155" y1="205" x2="150" y2="260" stroke="#76ff03" stroke-width="3" />

    <!-- Neck -->
    <rect x="115" y="160" width="35" height="50" fill="#ffffff" stroke="#090d16" stroke-width="3" />
    <!-- Neck shadow lines (crosshatch) -->
    <line x1="120" y1="180" x2="132" y2="200" stroke="#090d16" stroke-width="2" />
    <line x1="128" y1="180" x2="140" y2="200" stroke="#090d16" stroke-width="2" />

    <!-- Face Oval -->
    <path d="M 80,105 Q 80,185 132,185 Q 185,185 185,105 Q 185,55 132,55 Q 80,55 80,105 Z" fill="#ffffff" stroke="#090d16" stroke-width="3.5" />

    <!-- Anime Hair -->
    <path d="M 75,95 Q 60,35 110,20 Q 135,-5 165,15 Q 195,5 190,65 Q 200,80 195,105 Q 185,75 170,70 Q 145,35 125,55 Q 100,35 85,65 Z" fill="#090d16" />

    <!-- Glasses Frame -->
    <rect x="90" y="100" width="36" height="25" rx="7" fill="none" stroke="#090d16" stroke-width="3.5" />
    <rect x="138" y="100" width="36" height="25" rx="7" fill="none" stroke="#090d16" stroke-width="3.5" />
    <line x1="126" y1="110" x2="138" y2="110" stroke="#090d16" stroke-width="3.5" />
    <line x1="90" y1="108" x2="80" y2="112" stroke="#090d16" stroke-width="3" />
    <line x1="174" y1="108" x2="185" y2="112" stroke="#090d16" stroke-width="3" />

    <!-- Eyes (Friendly anime smile) -->
    <path d="M 98,112 Q 108,106 118,112" fill="none" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
    <path d="M 146,112 Q 156,106 166,112" fill="none" stroke="#090d16" stroke-width="3" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 132,126 L 129,134 L 135,134" fill="none" stroke="#090d16" stroke-width="2.5" stroke-linecap="round" />

    <!-- Confident Grin -->
    <path d="M 112,148 Q 132,168 152,148" fill="none" stroke="#090d16" stroke-width="3.5" stroke-linecap="round" />
    <line x1="118" y1="152" x2="146" y2="152" stroke="#090d16" stroke-width="2" />
  </g>
</svg>
